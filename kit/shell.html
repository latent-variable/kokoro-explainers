<!doctype html>
<!-- Generated by bin/build.mjs from scenes.html, script/ and timing.json. Edit those and rebuild; an edit here is lost. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>{{title}}</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* kit/shell.html: what every video shares. A video's own look is the styles in its scenes.html. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg: #0d1117;
        --ink: #f0f3f6;
        --muted: #9da7b3;
        --accent: #7cc4ff;
        --cap-bg: rgba(0, 0, 0, 0.78);
        --cap-ink: #ffffff;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      body { background: var(--bg); overflow: hidden; }
      #root { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }
      .scene { position: absolute; inset: 0; }
      .scene > .inner { position: absolute; inset: 0 0 180px 0; }
      .caps { position: absolute; left: 0; right: 0; bottom: 56px; height: 120px; }
      .cap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .cap span { max-width: 1500px; padding: 14px 28px; border-radius: 12px; background: var(--cap-bg); color: var(--cap-ink); font-size: 44px; line-height: 1.25; font-weight: 500; text-align: center; }
    </style>
    <style>
{{styles}}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{total}}" data-width="1920" data-height="1080">
      <audio id="narration" src="assets/narration.wav" data-start="0" data-duration="{{total}}" data-track-index="30" data-volume="1"></audio>
{{scenes}}
      <div class="caps">
{{captions}}
      </div>
    </div>
    <script>
      const TOTAL = {{total}};
{{kit}}
    </script>
    <script>
{{script}}
    </script>
  </body>
</html>
