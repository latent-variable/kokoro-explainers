<text x="42" y="66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#eef2f8">The critics</text>
<text x="42" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#b4bdcd">Fresh agents, one question each. The agent that made the video never judges it.</text>
