# Load balancer: ends TLS, spreads requests across the API instances. No access decisions.
upstream ledgerly_api { server api-1:8080; server api-2:8080; }
server {
  listen 443 ssl;
  location / {
    proxy_pass http://ledgerly_api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
